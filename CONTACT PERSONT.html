    <style>
        .social-floating {
          position: fixed;
          right: 20px;
          bottom: 20px;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        
        .social-floating a {
          width: 58px;
          height: 58px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 12px rgba(0,0,0,.2);
          transition: transform .3s ease;
          animation: pulse 2s infinite;
        }
        
        .social-floating a:hover {
          transform: scale(1.12);
        }
        
        .social-floating svg {
          width: 32px;
          height: 32px;
          fill: white;
        }
        
        .wa-btn { background: #25D366; }
        
        .ig-btn {
          background: linear-gradient(
            45deg, #feda75, #fa7e1e,
            #d62976, #962fbf, #4f5bd5
          );
        }
        
        @keyframes pulse {
          0%, 100% { box-shadow: 0 4px 12px rgba(0,0,0,.2); }
          50% { box-shadow: 0 4px 18px rgba(37,211,102,.4); }
        }
        </style>
